<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حساب و کتاب">
<title>حساب و کتاب</title>
<meta name="theme-color" content="#1f2a24">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:"Vazirmatn";src:url(vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#f5f2ec; --card:#fff; --ink:#1f2a24; --mute:#6b746e; --line:#e4dfd5;
  --inc:#1f7a4d; --inc-bg:#e3f2ea; --exp:#b3392f; --exp-bg:#f8e5e2; --warn:#b7791f; --warn-bg:#fdf3dc;
  --farm:#6b8e23; --home:#c0782b; --dairy:#2f6f9f; --acc:#2f6f9f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:18px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left)}
.wrap{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:8px 0 4px;font-weight:800}
.sub{color:var(--mute);font-size:.95rem;margin-bottom:16px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;color:inherit}
.menu{display:grid;gap:12px}
.sec-card{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;padding:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border-right:8px solid var(--c);text-align:right;width:100%}
.sec-card .ic{font-size:2.3rem;width:56px;height:56px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,white);border-radius:16px;flex:none}
.sec-card .nm{font-size:1.25rem;font-weight:800}
.sec-card .bal{font-size:.9rem;color:var(--mute);margin-top:3px}
.sec-card .arrow{margin-right:auto;font-size:1.6rem;color:var(--mute)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tool{background:var(--card);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.tool .ic{font-size:1.8rem}
.tool .nm{font-weight:700;font-size:.95rem;margin-top:4px}
.tool .badge{position:absolute;top:8px;left:8px;background:var(--exp);color:#fff;border-radius:10px;font-size:.75rem;padding:1px 7px;font-weight:700}
.alert{background:var(--warn-bg);color:#6b4a10;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:.95rem;line-height:1.8}
.alert.red{background:var(--exp-bg);color:var(--exp)}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.back{background:var(--card);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);white-space:nowrap}
.top h2{margin:0;font-size:1.3rem;font-weight:800}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:8px;margin-bottom:12px}
.month button{background:var(--bg);border-radius:12px;width:46px;height:42px;font-size:1.3rem}
.month .lbl{font-weight:700}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.box{background:var(--card);border-radius:16px;padding:12px 14px}
.box .k{font-size:.85rem;color:var(--mute)}
.box .v{font-size:1.15rem;font-weight:800;margin-top:2px}
.box.inc .v{color:var(--inc)} .box.exp .v{color:var(--exp)}
.box.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.small{font-size:.85rem;color:var(--mute)}
.addbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.addbtns button{padding:16px;border-radius:16px;font-weight:800;font-size:1.1rem}
.b-inc{background:var(--inc);color:#fff} .b-exp{background:var(--exp);color:#fff} .b-ink{background:var(--ink);color:#fff}
.list h3{font-size:1rem;color:var(--mute);margin:14px 4px 8px;font-weight:700}
.item{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:right}
.item .dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .mid{flex:1;min-width:0}
.item .cat{font-weight:700}
.item .meta{font-size:.85rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;white-space:nowrap;text-align:left}
.item.inc .amt{color:var(--inc)} .item.exp .amt{color:var(--exp)}
.item.inc .dot{background:var(--inc)} .item.exp .dot{background:var(--exp)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:8px;font-weight:700;margin-top:3px}
.tag.w{background:var(--warn-bg);color:var(--warn)} .tag.r{background:var(--exp-bg);color:var(--exp)} .tag.g{background:var(--inc-bg);color:var(--inc)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;background:var(--card);border-radius:16px;line-height:1.9}
.catsum{background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.catrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.catrow:last-child{border:none}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;background:transparent;font-weight:700;color:var(--mute);font-size:.95rem}
.tabs button.on{background:var(--bg);color:var(--ink)}
.party{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.party .ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.party .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem;width:100%;background:none;text-align:right}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:1.25rem}
label{display:block;font-size:.9rem;color:var(--mute);margin:12px 2px 6px;font-weight:500}
input,textarea,select{width:100%;font-family:inherit;font-size:1.1rem;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.amtin{font-size:1.45rem;font-weight:800;text-align:center}
.words{text-align:center;color:var(--mute);font-size:.88rem;margin-top:5px;min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 13px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:.98rem;position:relative}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .x{display:none;position:absolute;top:-8px;left:-8px;background:var(--exp);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.8rem;line-height:22px;text-align:center}
.editing .chip .x{display:block}
.linkbtn{background:none;color:var(--acc);font-size:.88rem;padding:6px 2px;text-decoration:underline}
.seg{display:flex;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:11px 4px;border-radius:10px;background:transparent;font-weight:700;font-size:.95rem;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.daterow{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.daterow input{text-align:center}
.subbox{background:#fff;border-radius:16px;padding:4px 12px 12px;margin-top:10px;border:1.5px dashed var(--line)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:1rem}
.check input{width:24px;height:24px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;padding:15px;border-radius:16px;font-weight:800;font-size:1.05rem}
.save{background:var(--ink);color:#fff} .cancel{background:#fff} .del{background:var(--exp-bg);color:var(--exp)} .ok{background:var(--inc);color:#fff}
.err{color:var(--exp);font-size:.9rem;margin-top:8px;min-height:1em}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.kv span:first-child{color:var(--mute)}
.foot{margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.foot button{background:transparent;color:var(--mute);font-size:.9rem;text-decoration:underline}
.note{font-size:.88rem;color:var(--mute);line-height:1.8}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:.95rem;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.hint{background:var(--warn-bg);border-radius:14px;padding:12px 14px;font-size:.88rem;line-height:1.8;margin-top:14px;color:#6b5a1f}
/* report */
.rep{background:#fff;border-radius:18px;padding:16px;margin-top:12px}
.rep h4{margin:18px 0 8px;font-size:1.05rem}
.rep h4:first-child{margin-top:0}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.rhead .t{font-size:1.25rem;font-weight:800}
.stbl{width:100%;border-collapse:collapse;font-size:.8rem}
.stbl th{background:var(--bg);font-weight:700;padding:7px 4px;text-align:right;position:sticky;top:0}
.stbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.stbl td.n{white-space:nowrap;text-align:left}
.tblwrap{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--mute);margin:4px 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.dlrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dlrow button{padding:14px;border-radius:14px;font-weight:800}
.sync{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;color:var(--mute);margin:-6px 0 14px}
.sync.err{color:var(--exp)}
.rob{background:var(--warn-bg);color:#6b4a10;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.9rem;text-align:center}
@media print{
  body{background:#fff;padding:0;font-size:12px}
  body.printing .wrap>*:not(#rep){display:none!important}
  body.printing .rep{padding:0;margin:0}
  body.printing .ov,body.printing .toast{display:none!important}
  .stbl th{position:static}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<datalist id="parties"></datalist>

<script>
(function(){
"use strict";
/* ================= Jalali ================= */
function div(a,b){return ~~(a/b)}
function g2d(gy,gm,gd){var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*((gm+9)%12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function jalCal(jy){var br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],gy=jy+621,leapJ=-14,jp=br[0],jm,jump,leap,leapG,march,n,i;
for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(jump%33,4);jp=jm}
n=jy-jp;leapJ=leapJ+div(n,33)*8+div(n%33+3,4);if(jump%33===4&&jump-n===4)leapJ+=1;
leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;if(jump-n<6)n=n-jump+div(jump+4,33)*33;
leap=((n+1)%33-1)%4;if(leap===-1)leap=4;return{leap:leap,gy:gy,march:march}}
function d2g(jdn){var j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;var i=div(j%1461,4)*5+308;var gd=div(i%153,5)+1;var gm=div(i,153)%12+1;return{gy:div(j,1461)-100100+div(8-gm,6),gm:gm,gd:gd}}
function d2j(jdn){var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy),k=jdn-g2d(gy,3,r.march),jm,jd;
if(k>=0){if(k<=185){jm=1+div(k,31);jd=k%31+1;return{jy:jy,jm:jm,jd:jd}}else k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
jm=7+div(k,30);jd=k%30+1;return{jy:jy,jm:jm,jd:jd}}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function todayJ(){var d=new Date();return d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate()))}
function monthLen(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return jalCal(jy).leap===0?30:29}
var MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function jn(o){return j2d(o.jy,o.jm,o.jd)}
function dstr(o){return fa(o.jd)+" "+MONTHS[o.jm-1]+" "+fa(o.jy)}
function dshort(o){return fa(String(o.jy).slice(2))+"/"+fa(o.jm)+"/"+fa(o.jd)}

/* ================= digits / money ================= */
var FA="۰۱۲۳۴۵۶۷۸۹";
function fa(s){return String(s).replace(/\d/g,function(d){return FA[d]})}
function toEn(s){return String(s==null?"":s).replace(/[۰-۹]/g,function(d){return FA.indexOf(d)}).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)})}
function money(n){var neg=n<0;n=Math.abs(Math.round(n));return (neg?"−":"")+fa(n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,"٬"))}
function moneyWords(n){if(!n)return "";var p=[],b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
if(b)p.push(fa(b)+" میلیارد");if(m)p.push(fa(m)+" میلیون");if(k)p.push(fa(k)+" هزار");if(r)p.push(fa(r));return p.join(" و ")+" تومان"}
function shortMoney(n){var a=Math.abs(n);if(a>=1e9)return fa((n/1e9).toFixed(1).replace(/\.0$/,""))+" میلیارد";if(a>=1e6)return fa((n/1e6).toFixed(a>=1e8?0:1).replace(/\.0$/,""))+" م";if(a>=1e3)return fa(Math.round(n/1e3))+" هـ";return fa(n)}
function num(v){return parseInt(toEn(v).replace(/[^\d]/g,""),10)||0}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}

/* ================= data ================= */
var SECS=[
 {id:"farm",nm:"مزرعه",ic:"🌾",c:"#6b8e23",
  exp:["بذر","کود","سم","آب و برق چاه","سوخت و تعمیر تراکتور","کارگر","اجاره ماشین‌آلات"],
  inc:["فروش محصول","فروش کاه و علوفه","اجاره زمین"]},
 {id:"home",nm:"خانه",ic:"🏠",c:"#c0782b",
  exp:["خوراک و بازار","قبض‌ها","ماشین و بنزین","دارو و درمان","تعمیرات خانه","پوشاک","مهمانی و هدیه","اقساط"],
  inc:["حقوق یا مستمری","اجاره","سود بانکی"]},
 {id:"dairy",nm:"گاوداری روزمهر",ic:"🐄",c:"#2f6f9f",
  exp:["خوراک دام","دارو و دامپزشکی","اسپرم و تلقیح","کارگر","آب، برق و گازوئیل","تعمیرات","خرید دام"],
  inc:["فروش شیر","فروش گوساله","فروش دام حذفی","فروش کود"]}
];
function secById(id){for(var i=0;i<SECS.length;i++)if(SECS[i].id===id)return SECS[i];return null}
function secName(id){var s=secById(id);return s?s.nm:"عمومی"}
var KEY="baba_hesab_v1",mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||{}}
var S=load();
function normalize(){
  if(!S.entries)S.entries=[];if(!S.cats)S.cats={};if(!S.checks)S.checks=[];
  S.entries.forEach(function(e){if(!e.pays)e.pays=[{id:uid(),amt:e.amt,jy:e.jy,jm:e.jm,jd:e.jd,via:"cash"}]});
}
normalize();
var lastGood=JSON.stringify(S);
function store(){mem=S;lastGood=JSON.stringify(S);try{localStorage.setItem(KEY,lastGood)}catch(e){}refreshParties()}
function save(){
  if(RO()){S=JSON.parse(lastGood);toast("این گوشی فقط برای دیدن است");render();return}
  S.updatedAt=Date.now();store();schedulePush();
}

/* ================= GitHub sync ================= */
var GKEY="baba_hesab_gh";
var GH=(function(){try{return JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){return{}}})();
function ghOn(){return !!(GH.repo&&GH.token)}
function RO(){return ghOn()&&GH.mode==="view"}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,""))))}
var SHA=null,DIRTY=false,PUSHING=false,pushT=null,SYNC={st:"",msg:""};
function api(method,body){
  return fetch("https://api.github.com/repos/"+GH.repo+"/contents/data.json"+(method==="GET"?"?t="+Date.now():""),
    {method:method,cache:"no-store",headers:{"Authorization":"Bearer "+GH.token,"Accept":"application/vnd.github+json"},body:body?JSON.stringify(body):undefined})
  .then(function(r){if(r.status===404&&method==="GET")return null;if(!r.ok){var e=new Error("http "+r.status);e.status=r.status;throw e}return r.json()});
}
function hhmm(){var d=new Date();return fa(("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2))}
function errMsg(e){return e&&(e.status===401||e.status===403)?"توکن اشتباه است یا منقضی شده":e&&e.status===404?"ریپو پیدا نشد (اسم یا دسترسی توکن)":"اتصال برقرار نشد — بعداً خودش دوباره تلاش می‌کند"}
function setSync(st,msg){SYNC={st:st,msg:msg};paintSync()}
function paintSync(){var el=$("syncline");if(!el)return;
  if(!ghOn()){el.className="sync";el.innerHTML="";return}
  el.className="sync"+(SYNC.st==="err"?" err":"");el.innerHTML=esc(SYNC.msg)+(RO()?' <button class="linkbtn" id="rf">به‌روز کن</button>':'');
  if($("rf"))$("rf").onclick=syncStart;}
function pull(){return api("GET").then(function(j){if(!j){SHA=null;return null}SHA=j.sha;return JSON.parse(b64d(j.content))})}
function adopt(remote){S=remote;normalize();store();render()}
function syncStart(){
  if(!ghOn())return Promise.resolve();
  setSync("busy","☁️ در حال گرفتن اطلاعات…");
  return pull().then(function(remote){
    if(RO()){if(remote){adopt(remote);setSync("ok","👀 فقط دیدن · به‌روز شد "+hhmm())}else setSync("ok","👀 هنوز اطلاعاتی ذخیره نشده");return}
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){adopt(remote);setSync("ok","☁️ همگام با گیت‌هاب ✓ "+hhmm());return}
    if(!remote||(S.updatedAt||0)>(remote.updatedAt||0)){DIRTY=true;return push()}
    setSync("ok","☁️ همگام با گیت‌هاب ✓ "+hhmm());
  }).catch(function(e){setSync("err","⚠️ "+errMsg(e))});
}
function schedulePush(){if(!ghOn()||RO())return;DIRTY=true;clearTimeout(pushT);pushT=setTimeout(push,1500)}
function push(){
  if(!ghOn()||RO()||!DIRTY)return Promise.resolve();
  if(PUSHING){clearTimeout(pushT);pushT=setTimeout(push,1500);return Promise.resolve()}

/* ================= REPORT ================= */
function reportData(){
  var secs=view.rsec==="all"?SECS.map(function(s){return s.id}):[view.rsec];
  var lo,hi,label;var pm=T.jm-1,py=T.jy;if(pm<1){pm=12;py--}
  if(view.rper==="month"){lo=j2d(T.jy,T.jm,1);hi=j2d(T.jy,T.jm,monthLen(T.jy,T.jm));label=MONTHS[T.jm-1]+" "+fa(T.jy)}
  else if(view.rper==="prev"){lo=j2d(py,pm,1);hi=j2d(py,pm,monthLen(py,pm));label=MONTHS[pm-1]+" "+fa(py)}
  else if(view.rper==="year"){lo=j2d(T.jy,1,1);hi=j2d(T.jy,12,monthLen(T.jy,12));label="سال "+fa(T.jy)}
  else{lo=-1e9;hi=1e9;label="همهٔ دوره‌ها"}
  var ents=S.entries.filter(function(e){var n=jn(e);return e.type!=="loan"&&secs.indexOf(e.sec)>=0&&n>=lo&&n<=hi}).sort(function(a,b){return jn(a)-jn(b)||a.ts-b.ts});
  var t=totals(ents);
  var scopeName=view.rsec==="all"?"همهٔ بخش‌ها":secName(view.rsec);
  // monthly series
  var months={};ents.forEach(function(e){var k=e.jy*100+e.jm;if(!months[k])months[k]={inc:0,exp:0};months[k][e.type]+=e.amt});
  var mkeys=Object.keys(months).map(Number).sort();
  // per section
  var bySec=SECS.filter(function(s){return secs.indexOf(s.id)>=0}).map(function(s){var tt=totals(ents.filter(function(e){return e.sec===s.id}));return{nm:s.nm,inc:tt.inc,exp:tt.exp}});
  // categories
  var cm={};ents.filter(function(e){return e.type==="exp"}).forEach(function(e){var k=e.cat;cm[k]=(cm[k]||0)+e.amt});
  var cats=Object.keys(cm).map(function(k){return{nm:k,v:cm[k]}}).sort(function(a,b){return b.v-a.v});
  var open=S.entries.filter(function(e){return rem(e)>0&&(e.type==="loan"||secs.indexOf(e.sec)>=0)});
  var owe=open.filter(function(e){return owesDir(e)==="owe"}),owed=open.filter(function(e){return owesDir(e)==="owed"});
  var chks=S.checks.filter(function(c){return c.status==="open"&&(view.rsec==="all"||c.sec===view.rsec)}).sort(function(a,b){return jn(a)-jn(b)});
  return{ents:ents,t:t,label:label,scopeName:scopeName,months:months,mkeys:mkeys,bySec:bySec,cats:cats,owe:owe,owed:owed,chks:chks};
}
function svgBars(groups){ // groups: [{lbl, inc, exp}]
  var W=560,H=230,pl=8,pr=58,pt=14,pb=44,max=1;groups.forEach(function(g){max=Math.max(max,g.inc,g.exp)});
  var nice=Math.pow(10,Math.floor(Math.log10(max)));max=Math.ceil(max/nice)*nice;
  var cw=(W-pl-pr)/groups.length,bw=Math.min(28,cw*0.32),s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn,Tahoma,sans-serif">';
  for(var i=0;i<=4;i++){var y=pt+(H-pt-pb)*(1-i/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#e4dfd5" stroke-width="1"/><text x="'+(W-pr+6)+'" y="'+(y+4)+'" font-size="11" fill="#6b746e" text-anchor="start">'+shortMoney(max*i/4)+'</text>'}
  groups.forEach(function(g,i){var cx=W-pr-cw*(i+.5),hI=(H-pt-pb)*g.inc/max,hE=(H-pt-pb)*g.exp/max,base=H-pb;
    s+='<rect x="'+(cx+1)+'" y="'+(base-hI)+'" width="'+bw+'" height="'+hI+'" rx="3" fill="#1f7a4d"><title>درآمد '+money(g.inc)+'</title></rect>';
    s+='<rect x="'+(cx-bw-1)+'" y="'+(base-hE)+'" width="'+bw+'" height="'+hE+'" rx="3" fill="#b3392f"><title>خرج '+money(g.exp)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(base+18)+'" font-size="12" fill="#1f2a24" text-anchor="middle">'+esc(g.lbl)+'</text>'});
  return s+'</svg>';
}
function catBarsHtml(cats){var tot=cats.reduce(function(a,c){return a+c.v},0)||1,top=cats.slice(0,8),rest=cats.slice(8).reduce(function(a,c){return a+c.v},0);if(rest)top.push({nm:"سایر",v:rest});
  return top.map(function(c){var p=Math.round(c.v/tot*100);return '<div class="catrow"><div style="flex:1"><div>'+esc(c.nm)+' <span class="small">'+fa(p)+'٪</span></div><div class="bar"><i style="width:'+p+'%;background:#b3392f"></i></div></div><div style="margin-right:12px;font-weight:700">'+money(c.v)+'</div></div>'}).join("")}
function reportHtml(R){
  var h='<div class="rhead"><div><div class="t">صورتحساب '+R.scopeName+'</div><div class="small">'+R.label+'</div></div><div class="small">تهیه: '+dstr(T)+'</div></div>';
  h+='<div class="sum"><div class="box inc" style="background:#e3f2ea"><div class="k">جمع درآمد</div><div class="v">'+money(R.t.inc)+'</div></div><div class="box exp" style="background:#f8e5e2"><div class="k">جمع خرج</div><div class="v">'+money(R.t.exp)+'</div></div>'+
     '<div class="box wide" style="background:#f5f2ec"><div class="k">مانده (سود / زیان) — تومان</div><div class="v" style="color:'+(R.t.net>=0?"#1f7a4d":"#b3392f")+'">'+money(R.t.net)+'</div></div></div>';
  if(!R.ents.length)return h+'<div class="empty">در این دوره چیزی ثبت نشده.</div>';
  var groups;
  if(R.mkeys.length>1)groups=R.mkeys.slice(-12).map(function(k){return{lbl:MONTHS[k%100-1],inc:R.months[k].inc,exp:R.months[k].exp}});
  else if(R.bySec.length>1)groups=R.bySec.map(function(s){return{lbl:s.nm,inc:s.inc,exp:s.exp}});
  else groups=null;
  if(groups){h+='<h4>'+(R.mkeys.length>1?"درآمد و خرج ماه به ماه":"درآمد و خرج هر بخش")+'</h4><div class="legend"><span><i style="background:#1f7a4d"></i>درآمد</span><span><i style="background:#b3392f"></i>خرج</span></div><div class="chart">'+svgBars(groups)+'</div>'}
  if(R.bySec.length>1&&R.mkeys.length>1){h+='<h4>هر بخش</h4><div class="catsum" style="padding:0">';R.bySec.forEach(function(s){h+='<div class="catrow"><span>'+s.nm+'</span><span class="small">درآمد <b style="color:#1f7a4d">'+money(s.inc)+'</b> · خرج <b style="color:#b3392f">'+money(s.exp)+'</b></span></div>'});h+='</div>'}
  if(R.cats.length){h+='<h4>خرج‌ها کجا رفته؟</h4><div class="catsum" style="padding:0">'+catBarsHtml(R.cats)+'</div>'}
  h+='<h4>ریز صورتحساب</h4><div class="tblwrap"><table class="stbl"><thead><tr><th>تاریخ</th>'+(view.rsec==="all"?'<th>بخش</th>':'')+'<th>شرح</th><th>طرف حساب</th><th class="n">درآمد</th><th class="n">خرج</th><th class="n">مانده</th></tr></thead><tbody>';
  var run=0;R.ents.forEach(function(e){run+=e.type==="inc"?e.amt:-e.amt;var r=rem(e);
    h+='<tr><td class="n">'+dshort(e)+'</td>'+(view.rsec==="all"?'<td>'+secName(e.sec)+'</td>':'')+'<td>'+esc(e.cat)+(e.note?'<br><span class="small">'+esc(e.note)+'</span>':'')+(r?'<br><span class="tag w">مانده '+money(r)+'</span>':'')+'</td><td>'+esc(e.party)+'</td><td class="n" style="color:#1f7a4d">'+(e.type==="inc"?money(e.amt):"")+'</td><td class="n" style="color:#b3392f">'+(e.type==="exp"?money(e.amt):"")+'</td><td class="n"><b>'+money(run)+'</b></td></tr>'});
  h+='<tr style="background:#f5f2ec;font-weight:800"><td colspan="'+(view.rsec==="all"?4:3)+'">جمع</td><td class="n" style="color:#1f7a4d">'+money(R.t.inc)+'</td><td class="n" style="color:#b3392f">'+money(R.t.exp)+'</td><td class="n">'+money(R.t.net)+'</td></tr></tbody></table></div>';
  if(R.owe.length||R.owed.length){h+='<h4>طلب و بدهی باز (تا امروز)</h4><div class="catsum" style="padding:0">';
    R.owe.forEach(function(e){h+='<div class="catrow"><span>بدهکار به '+esc(e.party||"—")+' <span class="small">('+esc(e.cat)+'، '+dshort(e)+')</span></span><b style="color:#b3392f">'+money(rem(e))+'</b></div>'});
    R.owed.forEach(function(e){h+='<div class="catrow"><span>طلب از '+esc(e.party||"—")+' <span class="small">('+esc(e.cat)+'، '+dshort(e)+')</span></span><b style="color:#1f7a4d">'+money(rem(e))+'</b></div>'});
    h+='</div>'}
  if(R.chks.length){h+='<h4>چک‌های در انتظار</h4><div class="catsum" style="padding:0">';
    R.chks.forEach(function(c){h+='<div class="catrow"><span>'+dstr(c)+' · '+(c.dir==="pay"?"پرداختی به ":"دریافتی از ")+esc(c.party||"—")+'</span><b style="color:'+(c.dir==="pay"?"#b3392f":"#1f7a4d")+'">'+money(c.amt)+'</b></div>'});h+='</div>'}
  return h;
}
function renderReport(){
  var R=reportData();
  var h='<div class="top">'+backBtn()+'<h2>📊 گزارش و خروجی</h2></div>';
  h+=segHtml("rs",[["all","همه"],["farm","مزرعه"],["home","خانه"],["dairy","گاوداری"]],view.rsec);
  h+='<div style="height:8px"></div>'+segHtml("rp",[["month","این ماه"],["prev","ماه قبل"],["year","امسال"],["ever","همه"]],view.rper);
  h+='<div class="rep" id="rep">'+reportHtml(R)+'</div>';
  h+='<div class="dlrow" style="grid-template-columns:1fr"><button class="b-ink" id="pr">🖨️ چاپ / ذخیره PDF</button></div>';
  h+='<div class="dlrow"><button class="cancel" style="background:#fff" id="dh">فرستادن گزارش (فایل)</button><button class="cancel" style="background:#fff" id="dc">فایل اکسل</button></div>';
  h+='<div class="note" style="margin-top:10px;text-align:center">برای PDF: «چاپ» را بزنید، بعد در صفحهٔ چاپ دکمهٔ اشتراک‌گذاری بالا ← Save to Files.</div>';
  app.innerHTML=h;wireBack();
  wireSeg("rs",function(v){view.rsec=v;render()});wireSeg("rp",function(v){view.rper=v;render()});
  $("pr").onclick=function(){document.body.classList.add("printing");setTimeout(function(){window.print();setTimeout(function(){document.body.classList.remove("printing")},500)},50)};
  $("dh").onclick=function(){dl("گزارش-"+R.scopeName+"-"+R.label+".html",standalone(R))};
  $("dc").onclick=function(){dl("صورتحساب-"+R.scopeName+"-"+R.label+".csv",csv(R))};
}
function standalone(R){
  var css=document.querySelector("style").textContent;
  return '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>صورتحساب '+esc(R.scopeName)+' – '+esc(R.label)+'</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet"><style>'+css+
  'body{background:#fff;padding:0}.rep{border-radius:0;padding:20px;max-width:900px;margin:0 auto}.stbl{font-size:.85rem}@media print{body{font-size:12px}.rep{padding:0}.tag{border:1px solid #ddd}}@page{size:A4;margin:14mm}</style></head><body><div class="rep">'+reportHtml(R)+'<div class="small" style="margin-top:20px;text-align:center">مبالغ به تومان</div></div></body></html>';
}
function csv(R){
  var rows=[["تاریخ","بخش","نوع","دسته","طرف حساب","توضیح","مبلغ","پرداخت‌شده","باقیمانده"]];
  R.ents.forEach(function(e){rows.push([e.jy+"/"+e.jm+"/"+e.jd,secName(e.sec),e.type==="inc"?"درآمد":"خرج",e.cat,e.party||"",e.note||"",e.amt,paid(e),rem(e)])});
  rows.push([]);rows.push(["","","","","","جمع درآمد",R.t.inc]);rows.push(["","","","","","جمع خرج",R.t.exp]);rows.push(["","","","","","مانده",R.t.net]);
  return "﻿"+rows.map(function(r){return r.map(function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")}).join("\r\n");
}
function dl(name,data){
  var ext=name.split(".").pop(),mime={html:"text/html",csv:"text/csv",json:"application/json"}[ext]||"application/octet-stream";
  var blob=new Blob([data],{type:mime+";charset=utf-8"});
  try{var file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return}}catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
}

/* ================= BACKUP / HELP ================= */
function openBackup(){
  var txt=JSON.stringify(S);
  openSheet('<h3>پشتیبان‌گیری</h3><p class="note">این متن همهٔ اطلاعات شماست (ثبت‌ها، چک‌ها، طلب و بدهی). کپی کنید و در Notes یا پیام به خودتان نگه دارید. هر چند وقت یک بار تکرار کنید.</p><textarea id="bt" rows="5" readonly style="font-size:.75rem;direction:ltr">'+esc(txt)+'</textarea><div class="actions"><button class="cancel" id="cx">بستن</button><button class="save" id="cp">کپی</button></div><div class="actions" style="margin-top:8px"><button class="cancel" id="bf">ذخیره به‌صورت فایل</button></div>');
  $("cx").onclick=closeSheet;
  $("bf").onclick=function(){dl("پشتیبان-حساب-"+T.jy+"-"+T.jm+"-"+T.jd+".json",txt)};
  $("cp").onclick=function(){var t=$("bt"),ok=function(){toast("کپی شد ✓")},fb=function(){t.select();try{document.execCommand("copy");ok()}catch(e){toast("متن را نگه دارید و کپی کنید")}};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}};
}
function openRestore(){
  openSheet('<h3>بازگردانی پشتیبان</h3><p class="note">متن پشتیبان را اینجا بچسبانید. اطلاعات فعلی جایگزین می‌شود.</p><textarea id="rt" rows="5" style="font-size:.8rem;direction:ltr"></textarea><div class="err" id="er"></div><div class="actions"><button class="cancel" id="cx">انصراف</button><button class="save" id="ok">بازگردانی</button></div>');
  $("cx").onclick=closeSheet;
  $("ok").onclick=function(){try{var d=JSON.parse($("rt").value);if(!d||!Array.isArray(d.entries))throw 0;S=d;normalize();save();closeSheet();go("menu");toast("بازگردانی شد ✓")}catch(e){$("er").textContent="این متن پشتیبان درست نیست"}};
}
function openHelp(){
  openSheet('<h3>نصب روی آیفون</h3><p class="note">۱. این صفحه را در <b>Safari</b> باز کنید.<br>۲. دکمهٔ اشتراک‌گذاری (مربع با فلش رو به بالا) را بزنید.<br>۳. <b>Add to Home Screen</b> را بزنید.<br>از این به بعد از آیکون روی صفحه باز کنید.</p><div class="hint">اطلاعات فقط روی همین گوشی ذخیره می‌شود. هر چند وقت یک بار «پشتیبان‌گیری» کنید.</div><div class="actions"><button class="save" id="cx">فهمیدم</button></div>');
  $("cx").onclick=closeSheet;
}

render();
syncStart();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
